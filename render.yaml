services:
  # Agent Manager FastAPI Web Service & WebSocket Engine
  - type: web
    name: agent-manager-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 8000
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agent-manager-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: agent-manager-redis
          property: connectionString
      - key: GITHUB_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # Managed Redis for Swarm Coordination & Webhooks
  - type: redis
    name: agent-manager-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  # Managed PostgreSQL for Relational Persistence
  - name: agent-manager-db
    plan: free
    region: oregon
    databaseName: agent_manager
    user: agent_admin
