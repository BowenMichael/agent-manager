name: Expo EAS & Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-eas-ci.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-eas-ci.yml'

jobs:
  frontend-checks:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci > npm_install.log 2>&1 || {
            echo "npm ci failed. Showing log tail:"
            tail -n 40 npm_install.log
            exit 1
          }
          rm -f npm_install.log

      - name: Type-check with TypeScript
        run: |
          echo "Running TypeScript typecheck..."
          npx tsc -b > tsc_run.log 2>&1 || {
            echo "❌ TypeScript typecheck failed! Showing last 40 lines:"
            tail -n 40 tsc_run.log
            exit 1
          }
          echo "✅ TypeScript check passed."
          rm -f tsc_run.log

      - name: Lint with oxlint
        run: |
          echo "Running oxlint..."
          npx oxlint > lint_run.log 2>&1 || {
            echo "❌ Lint check failed! Showing last 40 lines:"
            tail -n 40 lint_run.log
            exit 1
          }
          echo "✅ Lint check passed."
          rm -f lint_run.log

      - name: Vite Web Build Verification
        run: |
          echo "Verifying web production build..."
          npm run build > build_run.log 2>&1 || {
            echo "❌ Web build failed! Showing last 40 lines:"
            tail -n 40 build_run.log
            exit 1
          }
          echo "✅ Web build succeeded."
          rm -f build_run.log

  eas-preview-build:
    name: Expo EAS Preview & Web Export
    runs-on: ubuntu-latest
    needs: frontend-checks
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Check for EAS configuration and trigger Preview Build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "⚠️ EXPO_TOKEN is not configured in repository secrets. Skipping remote EAS build."
            exit 0
          fi

          if [ -f "eas.json" ]; then
            echo "Triggering EAS Preview Build..."
            eas build --profile preview --platform all --non-interactive
          else
            echo "ℹ️ No eas.json found in frontend directory. Running web export verification..."
            npx vite build
          fi
